spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/cooplogistics
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public

  jpa:
    hibernate:
      ddl-auto: validate
      open-in-view: false



logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.flyway: DEBUG
server:
  port: 8081