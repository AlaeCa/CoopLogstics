services:
  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coop-12345}
      PGDATA: /var/lib/postgresql/data
    networks:
      - microservice-net
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  mongo:
    container_name: mongo
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-coop-12345}
    ports:
      - "${MONGO_PORT:-27018}:27017"
    networks:
      - microservice-net
    volumes:
      - mongo:/data/db

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-coop-12345}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - microservice-net
    volumes:
      - pgadmin:/var/lib/pgadmin

  mongo-express:
    container_name: mongo-express
    image: mongo-express:latest
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-coop-12345}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASIC_AUTH: "false" # Set to "true" if you want password protection for the web UI itself
    ports:
      - "8081:8081"
    networks:
      - microservice-net

networks:
  microservice-net:
    driver: bridge

volumes:
  postgres:
  mongo:
  pgadmin: